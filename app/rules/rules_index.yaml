usage_guidelines:
  scanning_recommendations:
    - Use all rule files for comprehensive analysis
    - Enable niche-specific rules based on project type
    - Regularly update rules as new vulnerabilities emerge
    - Customize severity based on deployment environment

  performance_tips:
    - Enable incremental scanning for large codebases
    - Use file filtering for targeted scans
    - Cache results for unchanged files
    - Run in parallel with appropriate concurrency

  integration:
    - CI/CD pipeline integration recommended
    - Pre-commit hooks for early detection
    - IDE integration for real-time feedback
    - API integration for automated workflows