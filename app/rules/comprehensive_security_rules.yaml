rules:
  # ============================================================================
  # COMPREHENSIVE SECURITY RULES FOR WORLD-CLASS VULNERABILITY DETECTION
  # Target: 90%+ Accuracy (57+/64 vulnerabilities)
  # Coverage: All OWASP Top 10, CWE Top 25, and beyond
  # Languages: Python, JavaScript, TypeScript, Java, Go, C/C++, PHP, Ruby
  # ============================================================================

  # ===========================================
  # INJECTION VULNERABILITIES (A03:2021)
  # ===========================================

  # SQL INJECTION - PYTHON (Enhanced Detection)
  - id: python-sql-injection-format
    pattern-either:
      - pattern: |
          $QUERY = f"... {$VAR} ..."
          ...
          $CURSOR.execute($QUERY)
      - pattern: |
          $QUERY = "... " + $VAR + " ..."
          ...
          $CURSOR.execute($QUERY)
      - pattern: |
          $QUERY = "... %s ..." % $VAR
          ...
          $CURSOR.execute($QUERY)
      - pattern: $CURSOR.execute(f"... {$VAR} ...")
      - pattern: $CURSOR.execute("... " + $VAR + " ...")
      - pattern: $CURSOR.execute("... {} ...".format($VAR))
    message: "SQL injection vulnerability - unsafe string formatting in database query"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      owasp: "A03:2021 – Injection"

  - id: python-sql-injection-orm
    pattern-either:
      - pattern: |
          $MODEL.objects.extra(where=["..." + $VAR + "..."])
      - pattern: |
          $MODEL.objects.raw(f"... {$VAR} ...")
      - pattern: |
          $SESSION.execute(text(f"... {$VAR} ..."))
      - pattern: |
          $CONNECTION.execute("... " + $VAR + " ...")
    message: "SQL injection in ORM - unsafe query construction"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      owasp: "A03:2021 – Injection"

  # SQL INJECTION - JAVASCRIPT/TYPESCRIPT
  - id: js-sql-injection-template
    pattern-either:
      - pattern: |
          $QUERY = `... ${$VAR} ...`;
          ...
          $DB.query($QUERY)
      - pattern: |
          $QUERY = "... " + $VAR + " ...";
          ...
          $DB.query($QUERY)
      - pattern: $DB.query(`... ${$VAR} ...`)
      - pattern: $DB.query("... " + $VAR + " ...")
      - pattern: $DB.execute(`... ${$VAR} ...`)
      - pattern: $POOL.query(`... ${$VAR} ...`)
    message: "SQL injection vulnerability in JavaScript/TypeScript"
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      owasp: "A03:2021 – Injection"

  - id: js-sql-injection-sequelize
    pattern-either:
      - pattern: |
          $MODEL.findAll({
            where: $SEQUELIZE.literal(`... ${$VAR} ...`)
          })
      - pattern: |
          $SEQUELIZE.query(`... ${$VAR} ...`)
      - pattern: |
          $MODEL.sequelize.query("... " + $VAR + " ...")
    message: "SQL injection in Sequelize ORM"
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      owasp: "A03:2021 – Injection"

  # SQL INJECTION - JAVA
  - id: java-sql-injection-concat
    pattern-either:
      - pattern: |
          $QUERY = "... " + $VAR + " ...";
          ...
          $STMT.executeQuery($QUERY)
      - pattern: |
          String $QUERY = String.format("... %s ...", $VAR);
          ...
          $STMT.executeQuery($QUERY)
      - pattern: $STMT.executeQuery("... " + $VAR + " ...")
      - pattern: $STMT.executeUpdate("... " + $VAR + " ...")
      - pattern: $CONN.prepareStatement("... " + $VAR + " ...")
    message: "SQL injection vulnerability in Java"
    languages: [java]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      owasp: "A03:2021 – Injection"

  - id: java-sql-injection-jpa
    pattern-either:
      - pattern: |
          $EM.createQuery("... " + $VAR + " ...")
      - pattern: |
          $EM.createNativeQuery("... " + $VAR + " ...")
      - pattern: |
          @Query("... " + $VAR + " ...")
    message: "SQL injection in JPA/Hibernate query"
    languages: [java]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      owasp: "A03:2021 – Injection"

  # SQL INJECTION - GO
  - id: go-sql-injection-fmt
    pattern-either:
      - pattern: |
          $QUERY := "... " + $VAR + " ..."
          $DB.Query($QUERY)
      - pattern: |
          $QUERY := fmt.Sprintf("... %s ...", $VAR)
          $DB.Query($QUERY)
      - pattern: $DB.Query("... " + $VAR + " ...")
      - pattern: $DB.Exec("... " + $VAR + " ...")
      - pattern: $TX.Query("... " + $VAR + " ...")
    message: "SQL injection vulnerability in Go"
    languages: [go]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      owasp: "A03:2021 – Injection"

  # SQL INJECTION - PHP
  - id: php-sql-injection-concat
    pattern-either:
      - pattern: |
          $query = "... " . $var . " ...";
          mysql_query($query)
      - pattern: |
          $query = "... " . $var . " ...";
          mysqli_query($conn, $query)
      - pattern: mysql_query("... " . $var . " ...")
      - pattern: mysqli_query($conn, "... " . $var . " ...")
      - pattern: $pdo->query("... " . $var . " ...")
      - pattern: $pdo->exec("... " . $var . " ...")
    message: "SQL injection vulnerability in PHP"
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
      owasp: "A03:2021 – Injection"

  # COMMAND INJECTION - PYTHON
  - id: python-command-injection-subprocess
    pattern-either:
      - pattern: subprocess.call($VAR, shell=True)
      - pattern: subprocess.Popen($VAR, shell=True)
      - pattern: subprocess.run($VAR, shell=True)
      - pattern: subprocess.check_call($VAR, shell=True)
      - pattern: subprocess.check_output($VAR, shell=True)
      - pattern: os.system($VAR)
      - pattern: os.popen($VAR)
      - pattern: os.spawnl(os.P_WAIT, $VAR, ...)
    message: "Command injection vulnerability in Python"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      owasp: "A03:2021 – Injection"

  # COMMAND INJECTION - JAVASCRIPT
  - id: js-command-injection-child-process
    pattern-either:
      - pattern: exec($VAR)
      - pattern: execSync($VAR)
      - pattern: "spawn($VAR, {shell: true})"
      - pattern: "spawnSync($VAR, {shell: true})"
      - pattern: execFile($VAR)
      - pattern: fork($VAR)
      - pattern: $CHILD_PROCESS.exec($VAR)
    message: "Command injection vulnerability in JavaScript"
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      owasp: "A03:2021 – Injection"

  # COMMAND INJECTION - JAVA
  - id: java-command-injection-runtime
    pattern-either:
      - pattern: Runtime.getRuntime().exec($VAR)
      - pattern: ProcessBuilder($VAR)
      - pattern: new ProcessBuilder($VAR)
      - pattern: |
          ProcessBuilder $PB = new ProcessBuilder();
          $PB.command($VAR)
      - pattern: |
          $PB.command("sh", "-c", $VAR)
    message: "Command injection vulnerability in Java"
    languages: [java]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      owasp: "A03:2021 – Injection"

  # COMMAND INJECTION - GO
  - id: go-command-injection-exec
    pattern-either:
      - pattern: exec.Command($VAR)
      - pattern: exec.Command("sh", "-c", $VAR)
      - pattern: exec.Command("bash", "-c", $VAR)
      - pattern: exec.Command("cmd", "/C", $VAR)
      - pattern: |
          $CMD := exec.Command("sh", "-c", $VAR)
          $CMD.Run()
    message: "Command injection vulnerability in Go"
    languages: [go]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      owasp: "A03:2021 – Injection"

  # COMMAND INJECTION - PHP
  - id: php-command-injection-exec
    pattern-either:
      - pattern: exec($var)
      - pattern: system($var)
      - pattern: shell_exec($var)
      - pattern: passthru($var)
      - pattern: proc_open($var, ...)
      - pattern: popen($var, ...)
      - pattern: |
          \`$var\`
    message: "Command injection vulnerability in PHP"
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-78"]
      owasp: "A03:2021 – Injection"

  # CODE INJECTION - ALL LANGUAGES
  - id: python-code-injection-eval
    pattern-either:
      - pattern: eval($VAR)
      - pattern: exec($VAR)
      - pattern: compile($VAR, ...)
      - patterns:
        - pattern: eval($EXPR)
        - pattern-not: eval("...")
      - patterns:
        - pattern: exec($EXPR)
        - pattern-not: exec("...")
    message: "Code injection vulnerability via eval/exec"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-95"]
      owasp: "A03:2021 – Injection"

  - id: js-code-injection-eval
    patterns:
      - pattern: eval($VAR)
      - pattern-not: eval("...")
    message: "Code injection vulnerability via eval in JavaScript"
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-95"]
      owasp: "A03:2021 – Injection"

  - id: php-code-injection-eval
    patterns:
      - pattern: eval($var)
      - pattern-not: eval("...")
    message: "Code injection vulnerability via eval in PHP"
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-95"]
      owasp: "A03:2021 – Injection"

  # LDAP INJECTION
  - id: java-ldap-injection
    pattern-either:
      - pattern: |
          $FILTER = "... " + $VAR + " ...";
          ...
          $CTX.search(..., $FILTER, ...)
      - pattern: $CTX.search(..., "... " + $VAR + " ...", ...)
      - pattern: |
          String $FILTER = String.format("... %s ...", $VAR);
          ...
          $CTX.search(..., $FILTER, ...)
    message: "LDAP injection vulnerability detected"
    languages: [java]
    severity: ERROR
    metadata:
      cwe: ["CWE-90"]
      owasp: "A03:2021 – Injection"

  # ===========================================
  # XSS VULNERABILITIES (A03:2021)
  # ===========================================

  # XSS - PYTHON (Flask/Django)
  - id: python-xss-template-injection
    pattern-either:
      - pattern: |
          $HTML = f"<...{$VAR}...>"
          return $HTML
      - pattern: |
          $HTML = "<..." + $VAR + "...>"
          return $HTML
      - pattern: |
          return f"<...{$VAR}...>"
      - pattern: |
          return "<..." + $VAR + "...>"
      - pattern: |
          render_template_string(f"... {$VAR} ...")
      - pattern: |
          mark_safe(f"<...{$VAR}...>")
    message: "XSS vulnerability - unescaped user input in HTML"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-79"]
      owasp: "A03:2021 – Injection"

  # XSS - JAVASCRIPT/TYPESCRIPT
  - id: js-xss-dom-manipulation
    pattern-either:
      - pattern: |
          $HTML = `<...${$VAR}...>`;
          document.write($HTML)
      - pattern: |
          document.write(`<...${$VAR}...>`)
      - pattern: |
          document.innerHTML = `<...${$VAR}...>`
      - pattern: |
          $ELEMENT.innerHTML = `<...${$VAR}...>`
      - pattern: |
          $ELEMENT.outerHTML = `<...${$VAR}...>`
      - pattern: |
          $ELEMENT.insertAdjacentHTML('...', `<...${$VAR}...>`)
    message: "XSS vulnerability - unescaped user input in DOM"
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-79"]
      owasp: "A03:2021 – Injection"

  - id: js-xss-jquery
    pattern-either:
      - pattern: |
          $($ELEMENT).html(`<...${$VAR}...>`)
      - pattern: |
          $($ELEMENT).append(`<...${$VAR}...>`)
      - pattern: |
          $($ELEMENT).prepend(`<...${$VAR}...>`)
      - pattern: |
          $($ELEMENT).after(`<...${$VAR}...>`)
      - pattern: |
          $($ELEMENT).before(`<...${$VAR}...>`)
    message: "XSS vulnerability in jQuery manipulation"
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-79"]
      owasp: "A03:2021 – Injection"

  # XSS - JAVA (JSP/Servlet)
  - id: java-xss-servlet-response
    pattern-either:
      - pattern: |
          $HTML = "<..." + $VAR + "...>";
          $RESPONSE.getWriter().write($HTML)
      - pattern: |
          $RESPONSE.getWriter().write("<..." + $VAR + "...>")
      - pattern: |
          out.println("<..." + $VAR + "...>")
      - pattern: |
          $RESPONSE.getWriter().println("<..." + $VAR + "...>")
    message: "XSS vulnerability in Java servlet response"
    languages: [java]
    severity: ERROR
    metadata:
      cwe: ["CWE-79"]
      owasp: "A03:2021 – Injection"

  # XSS - PHP
  - id: php-xss-echo-unescaped
    pattern-either:
      - pattern: echo $var;
      - pattern: print $var;
      - pattern: printf($var);
      - pattern: |
          echo "<..." . $var . "...>";
      - pattern: |
          print "<..." . $var . "...>";
      - pattern: |
          echo $_GET[$key];
      - pattern: |
          echo $_POST[$key];
      - pattern: |
          echo $_REQUEST[$key];
    message: "XSS vulnerability - unescaped output in PHP"
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-79"]
      owasp: "A03:2021 – Injection"

  # ===========================================
  # HARDCODED SECRETS (A07:2021)
  # ===========================================

  # HARDCODED SECRETS - PYTHON
  - id: python-hardcoded-secrets-advanced
    pattern-either:
      - pattern: PASSWORD = "$VALUE"
      - pattern: SECRET_KEY = "$VALUE"
      - pattern: API_TOKEN = "$VALUE"
      - pattern: API_KEY = "$VALUE"
      - pattern: JWT_SECRET = "$VALUE"
      - pattern: DATABASE_PASSWORD = "$VALUE"
      - pattern: PRIVATE_KEY = "$VALUE"
      - pattern: ENCRYPTION_KEY = "$VALUE"
      - pattern: ACCESS_TOKEN = "$VALUE"
      - pattern: REFRESH_TOKEN = "$VALUE"
      - pattern: WEBHOOK_SECRET = "$VALUE"
      - pattern: CLIENT_SECRET = "$VALUE"
    pattern-where-python: |
      import re
      value = vars["$VALUE"]
      # Check for secrets that look like real credentials (not placeholders)
      return len(value) > 8 and not any(placeholder in value.lower() for placeholder in ['placeholder', 'example', 'test', 'dummy', 'fake', 'xxx', 'yyy', 'zzz'])
    message: "Hardcoded secret detected in Python"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      owasp: "A07:2021 – Identification and Authentication Failures"

  # HARDCODED SECRETS - JAVASCRIPT
  - id: js-hardcoded-secrets-advanced
    pattern-either:
      - pattern: |
          const $VAR = "$VALUE";
      - pattern: |
          var $VAR = "$VALUE";
      - pattern: |
          let $VAR = "$VALUE";
      - pattern: |
          $VAR: "$VALUE"
    pattern-where-python: |
      import re
      value = vars["$VALUE"]
      var_name = vars["$VAR"].upper()
      secret_keywords = ["SECRET", "PASSWORD", "TOKEN", "KEY", "API", "JWT", "AUTH", "PRIVATE", "CREDENTIAL", "CERT"]
      is_secret_var = any(keyword in var_name for keyword in secret_keywords)
      is_real_value = len(value) > 10 and not any(placeholder in value.lower() for placeholder in ['placeholder', 'example', 'test', 'dummy', 'fake'])
      return is_secret_var and is_real_value
    message: "Hardcoded secret detected in JavaScript"
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      owasp: "A07:2021 – Identification and Authentication Failures"

  # HARDCODED SECRETS - JAVA
  - id: java-hardcoded-secrets-advanced
    pattern-either:
      - pattern: |
          private static final String $VAR = "$VALUE";
      - pattern: |
          public static final String $VAR = "$VALUE";
      - pattern: |
          String $VAR = "$VALUE";
      - pattern: |
          private String $VAR = "$VALUE";
      - pattern: |
          public String $VAR = "$VALUE";
    pattern-where-python: |
      import re
      value = vars["$VALUE"]
      var_name = vars["$VAR"].upper()
      secret_keywords = ["PASSWORD", "SECRET", "KEY", "TOKEN", "API", "JWT", "PRIVATE", "CREDENTIAL", "ENCRYPTION"]
      is_secret_var = any(keyword in var_name for keyword in secret_keywords)
      is_real_value = len(value) > 8 and not any(placeholder in value.lower() for placeholder in ['placeholder', 'example', 'test', 'dummy'])
      return is_secret_var and is_real_value
    message: "Hardcoded secret detected in Java"
    languages: [java]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      owasp: "A07:2021 – Identification and Authentication Failures"

  # HARDCODED SECRETS - GO
  - id: go-hardcoded-secrets-advanced
    pattern-either:
      - pattern: |
          const $VAR = "$VALUE"
      - pattern: |
          var $VAR = "$VALUE"
      - pattern: |
          $VAR := "$VALUE"
    pattern-where-python: |
      import re
      value = vars["$VALUE"]
      var_name = vars["$VAR"].upper()
      secret_keywords = ["SECRET", "PASSWORD", "TOKEN", "KEY", "API", "JWT", "PRIVATE", "CREDENTIAL"]
      is_secret_var = any(keyword in var_name for keyword in secret_keywords)
      is_real_value = len(value) > 10 and not any(placeholder in value.lower() for placeholder in ['placeholder', 'example', 'test', 'dummy'])
      return is_secret_var and is_real_value
    message: "Hardcoded secret detected in Go"
    languages: [go]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      owasp: "A07:2021 – Identification and Authentication Failures"

  # HARDCODED SECRETS - PHP
  - id: php-hardcoded-secrets-advanced
    pattern-either:
      - pattern: |
          $password = "$VALUE";
      - pattern: |
          $secret = "$VALUE";
      - pattern: |
          $api_key = "$VALUE";
      - pattern: |
          define('$VAR', '$VALUE');
      - pattern: |
          const $VAR = '$VALUE';
    pattern-where-python: |
      import re
      value = vars["$VALUE"]
      var_name = str(vars.get("$VAR", "")).upper()
      secret_keywords = ["PASSWORD", "SECRET", "KEY", "TOKEN", "API", "JWT", "PRIVATE"]
      is_secret_var = any(keyword in var_name for keyword in secret_keywords)
      is_real_value = len(value) > 8 and not any(placeholder in value.lower() for placeholder in ['placeholder', 'example', 'test'])
      return is_secret_var and is_real_value
    message: "Hardcoded secret detected in PHP"
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]
      owasp: "A07:2021 – Identification and Authentication Failures"

  # ===========================================
  # CRYPTOGRAPHIC FAILURES (A02:2021)
  # ===========================================

  # WEAK CRYPTOGRAPHIC HASHES
  - id: python-weak-crypto-hash
    pattern-either:
      - pattern: hashlib.md5($VAR)
      - pattern: hashlib.sha1($VAR)
      - pattern: hashlib.new('md5', $VAR)
      - pattern: hashlib.new('sha1', $VAR)
      - pattern: |
          import md5
          md5.new($VAR)
    message: "Weak cryptographic hash function (MD5/SHA1) detected"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-328"]
      owasp: "A02:2021 – Cryptographic Failures"

  - id: js-weak-crypto-hash
    pattern-either:
      - pattern: crypto.createHash('md5')
      - pattern: crypto.createHash('sha1')
      - pattern: |
          require('crypto').createHash('md5')
      - pattern: |
          require('crypto').createHash('sha1')
    message: "Weak cryptographic hash function detected in JavaScript"
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      cwe: ["CWE-328"]
      owasp: "A02:2021 – Cryptographic Failures"

  - id: java-weak-crypto-hash
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA1")
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: |
          MessageDigest $MD = MessageDigest.getInstance("MD5");
    message: "Weak cryptographic hash function detected in Java"
    languages: [java]
    severity: ERROR
    metadata:
      cwe: ["CWE-328"]
      owasp: "A02:2021 – Cryptographic Failures"

  - id: go-weak-crypto-hash
    pattern-either:
      - pattern: md5.New()
      - pattern: sha1.New()
      - pattern: |
          import "crypto/md5"
          ...
          md5.Sum($VAR)
      - pattern: |
          import "crypto/sha1"
          ...
          sha1.Sum($VAR)
    message: "Weak cryptographic hash function detected in Go"
    languages: [go]
    severity: ERROR
    metadata:
      cwe: ["CWE-328"]
      owasp: "A02:2021 – Cryptographic Failures"

  - id: php-weak-crypto-hash
    pattern-either:
      - pattern: md5($var)
      - pattern: sha1($var)
      - pattern: hash('md5', $var)
      - pattern: hash('sha1', $var)
      - pattern: crypt($var, $salt)
    message: "Weak cryptographic hash function detected in PHP"
    languages: [php]
    severity: ERROR
    metadata:
      cwe: ["CWE-328"]
      owasp: "A02:2021 – Cryptographic Failures"

  # INSECURE RANDOM NUMBER GENERATION
  - id: python-insecure-random
    pattern-either:
      - pattern: random.random()
      - pattern: random.randint(...)
      - pattern: random.choice(...)
      - pattern: random.randrange(...)
      - pattern: random.uniform(...)
      - pattern: |
          import random
          ...
          random.seed($SEED)
    message: "Insecure random number generation for cryptographic purposes"
    languages: [python]
    severity: WARNING
    metadata:
      cwe: ["CWE-338"]
      owasp: "A02:2021 – Cryptographic Failures"

  - id: js-insecure-random
    pattern-either:
      - pattern: Math.random()
      - pattern: |
          Math.floor(Math.random() * $N)
    message: "Insecure random number generation for cryptographic purposes"
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      cwe: ["CWE-338"]
      owasp: "A02:2021 – Cryptographic Failures"

  - id: java-insecure-random
    pattern-either:
      - pattern: new Random()
      - pattern: Math.random()
      - pattern: |
          Random $R = new Random();
          $R.nextInt(...)
    message: "Insecure random number generation for cryptographic purposes"
    languages: [java]
    severity: WARNING
    metadata:
      cwe: ["CWE-338"]
      owasp: "A02:2021 – Cryptographic Failures"

  - id: go-insecure-random
    pattern-either:
      - pattern: rand.Int()
      - pattern: rand.Intn(...)
      - pattern: rand.Float32()
      - pattern: rand.Float64()
      - pattern: |
          import "math/rand"
          ...
          rand.Seed($SEED)
    message: "Insecure random number generation for cryptographic purposes"
    languages: [go]
    severity: WARNING
    metadata:
      cwe: ["CWE-338"]
      owasp: "A02:2021 – Cryptographic Failures"

  # WEAK ENCRYPTION
  - id: python-weak-encryption
    pattern-either:
      - pattern: |
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          cipher = Cipher(algorithms.DES($KEY), ...)
      - pattern: |
          Cipher(algorithms.TripleDES($KEY), ...)
      - pattern: |
          from Crypto.Cipher import DES
          DES.new($KEY, ...)
      - pattern: |
          from Crypto.Cipher import ARC4
          ARC4.new($KEY)
    message: "Weak encryption algorithm detected"
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-327"]
      owasp: "A02:2021 – Cryptographic Failures"

  - id: java-weak-encryption
    pattern-either:
      - pattern: Cipher.getInstance("DES")
      - pattern: Cipher.getInstance("DESede")
      - pattern: Cipher.getInstance("RC4")
      - pattern: Cipher.getInstance("RC2")
