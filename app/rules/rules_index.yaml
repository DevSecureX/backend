# DevSecureX Security Rules Index
# World-class security detection rules for comprehensive code analysis

version: "2.0"
last_updated: "2024-01-09"

rule_categories:
  ai_ml:
    description: "AI/ML security rules for PyTorch, TensorFlow, JAX, and ML pipelines"
    files:
      - ai.yaml           # Original 5 rules
      - ai_enhanced.yaml  # Additional 20 rules
    coverage:
      - Model loading and deserialization
      - Pickle vulnerabilities
      - Dataset poisoning
      - Federated learning attacks
      - Differential privacy
      - LLM/Shadow AI detection
      - GPU memory security
      - ML supply chain attacks

  blockchain:
    description: "Smart contract and blockchain security"
    files:
      - blockchain.yaml           # Original 5 rules
      - blockchain_enhanced.yaml  # Additional 20 rules
    coverage:
      - Reentrancy vulnerabilities
      - Flash loan attacks
      - Price oracle manipulation
      - Integer overflows
      - Access control issues
      - Signature vulnerabilities
      - Cross-chain attacks
      - DeFi-specific patterns

  iot_embedded:
    description: "IoT and embedded systems security"
    files:
      - iot.yaml           # Original 5 rules
      - iot_enhanced.yaml  # Additional 22 rules
    coverage:
      - Buffer overflows
      - Memory corruption
      - Firmware security
      - Hardware attacks
      - Secure boot
      - OTA updates
      - Sensor validation
      - Physical attack vectors

  web3_frontend:
    description: "Web3 and DApp frontend security"
    files:
      - web3.yaml  # 15 new rules
    coverage:
      - Private key exposure
      - MetaMask integration
      - Chain ID validation
      - BigNumber handling
      - IPFS security
      - Transaction security
      - Event listener management

  cloud_native:
    description: "Kubernetes, Docker, and cloud infrastructure"
    files:
      - cloud_native.yaml  # 20 new rules
    coverage:
      - Container security
      - Kubernetes misconfigurations
      - Service mesh security
      - Terraform/IaC security
      - Secrets management
      - Network policies
      - RBAC issues

  api_security:
    description: "REST, GraphQL, and gRPC API security"
    files:
      - api_security.yaml  # 16 new rules
    coverage:
      - GraphQL vulnerabilities
      - JWT security
      - Rate limiting
      - CORS misconfigurations
      - Injection attacks
      - Authentication/Authorization
      - API versioning

