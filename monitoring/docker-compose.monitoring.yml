# DevSecureX Monitoring Stack
# Comprehensive monitoring infrastructure with Prometheus, Grafana, Jaeger, and ELK Stack

version: '3.8'

services:
  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: devsecurex-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "monitoring.service=prometheus"
      - "monitoring.stack=devsecurex"

  # Grafana - Visualization and Dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: devsecurex-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000/
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus
    labels:
      - "monitoring.service=grafana"
      - "monitoring.stack=devsecurex"

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.49
    container_name: devsecurex-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector
      - "6831:6831/udp"  # Jaeger agent
      - "6832:6832/udp"  # Jaeger agent
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    volumes:
      - jaeger_data:/tmp
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "monitoring.service=jaeger"
      - "monitoring.stack=devsecurex"

  # Elasticsearch - Log Storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: devsecurex-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=devsecurex-logging
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "monitoring.service=elasticsearch"
      - "monitoring.stack=devsecurex"

  # Kibana - Log Analysis and Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: devsecurex-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
    volumes:
      - kibana_data:/usr/share/kibana/data
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - elasticsearch
    labels:
      - "monitoring.service=kibana"
      - "monitoring.stack=devsecurex"

  # Logstash - Log Processing
  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.0
    container_name: devsecurex-logstash
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - elasticsearch
    labels:
      - "monitoring.service=logstash"
      - "monitoring.stack=devsecurex"

  # Redis - Metrics and Session Storage
  redis-monitoring:
    image: redis:7.2-alpine
    container_name: devsecurex-redis-monitoring
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --requirepass redis_monitor_pass
    volumes:
      - redis_monitoring_data:/data
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "monitoring.service=redis"
      - "monitoring.stack=devsecurex"

  # Alertmanager - Alert Management
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: devsecurex-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "monitoring.service=alertmanager"
      - "monitoring.stack=devsecurex"

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: devsecurex-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "monitoring.service=node-exporter"
      - "monitoring.stack=devsecurex"

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: devsecurex-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "monitoring.service=cadvisor"
      - "monitoring.stack=devsecurex"

  # Prometheus Push Gateway - Batch Job Metrics
  pushgateway:
    image: prom/pushgateway:v1.6.2
    container_name: devsecurex-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped
    networks:
      - monitoring
    labels:
      - "monitoring.service=pushgateway"
      - "monitoring.stack=devsecurex"

volumes:
  prometheus_data:
  grafana_data:
  jaeger_data:
  elasticsearch_data:
  kibana_data:
  redis_monitoring_data:
  alertmanager_data:

networks:
  monitoring:
    driver: bridge
    name: devsecurex-monitoring