# DevSecureX Logstash Pipeline Configuration
# Process structured logs from DevSecureX application

input {
  # HTTP input for application logs
  http {
    port => 5000
    codec => json
    tags => ["devsecurex", "application"]
  }
  
  # UDP input for high-volume logs
  udp {
    port => 5000
    codec => json
    tags => ["devsecurex", "application", "udp"]
  }
  
  # File input for log files (if needed)
  file {
    path => "/var/log/devsecurex/*.log"
    start_position => "beginning"
    codec => json
    tags => ["devsecurex", "file"]
  }
}

filter {
  # Parse DevSecureX structured logs
  if [logger_name] {
    mutate {
      add_field => { "service" => "devsecurex" }
    }
    
    # Extract optimization phase from log context
    if [optimization_phase] {
      mutate {
        add_field => { "phase" => "%{optimization_phase}" }
      }
    }
    
    # Parse security scan logs
    if [scan_id] {
      mutate {
        add_field => { "log_type" => "security_scan" }
      }
    }
    
    # Parse database operation logs
    if [db_operation] {
      mutate {
        add_field => { "log_type" => "database" }
      }
    }
    
    # Parse cache operation logs
    if [cache_operation] {
      mutate {
        add_field => { "log_type" => "cache" }
      }
    }
    
    # Parse task system logs
    if [task_id] {
      mutate {
        add_field => { "log_type" => "task_system" }
      }
    }
    
    # Parse API request logs
    if [endpoint] {
      mutate {
        add_field => { "log_type" => "api_request" }
      }
    }
  }
  
  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  # Add geographic information if available
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
  
  # Enrich with performance metrics context
  if [response_time] {
    if [response_time] > 5000 {
      mutate {
        add_tag => [ "slow_response" ]
      }
    }
  }
  
  if [level] == "ERROR" or [level] == "CRITICAL" {
    mutate {
      add_tag => [ "error" ]
    }
  }
  
  # Clean up fields
  mutate {
    remove_field => [ "headers", "host" ]
  }
}

output {
  # Send to Elasticsearch with appropriate index pattern
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    
    # Dynamic index based on log type and date
    index => "devsecurex-%{[log_type]:application}-%{+YYYY.MM.dd}"
    
    # Use document type based on service
    document_type => "_doc"
    
    # Template for DevSecureX indices
    template_name => "devsecurex"
    template_pattern => "devsecurex-*"
    template => "/usr/share/logstash/templates/devsecurex-template.json"
    template_overwrite => true
  }
  
  # Debug output (remove in production)
  if "debug" in [tags] {
    stdout {
      codec => rubydebug
    }
  }
}