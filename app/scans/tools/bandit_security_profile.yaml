# Include all severity levels for comprehensive scanning
severity: all

# Include all confidence levels for maximum detection
confidence: all

# Enhanced hardcoded password detection patterns
hardcoded_password_patterns:
  - "password"
  - "passwd" 
  - "pwd"
  - "secret"
  - "key"
  - "token"
  - "api_key"
  - "apikey"
  - "access_key"
  - "private_key"
  - "auth"
  - "credential"
