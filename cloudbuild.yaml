# GCP Cloud Build configuration for DevSecureX Backend
# Optimized for production deployment with security scanning
steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/devsecurex-backend:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/devsecurex-backend:latest',
      '--build-arg', 'BUILD_PROFILE=production',
      '.'
    ]
    timeout: 1200s

  # Security scan (optional - remove if causing delays)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container images scan gcr.io/$PROJECT_ID/devsecurex-backend:$COMMIT_SHA \
          --format="value(response.scan.analysisStatus)" || echo "Scan completed with findings"
    timeout: 300s

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/devsecurex-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/devsecurex-backend:latest']

  # Deploy to Cloud Run (replace with your service name)
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run',
      'deploy',
      'devsecurex-backend',
      '--image', 'gcr.io/$PROJECT_ID/devsecurex-backend:$COMMIT_SHA',
      '--region', '${_REGION}',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '8080',
      '--memory', '2Gi',
      '--cpu', '2',
      '--concurrency', '200',
      '--timeout', '3600',
      '--max-instances', '10',
      '--min-instances', '1',
      '--set-env-vars', 'APP_ENV=production,TESTING_MODE=false',
      '--set-cloudsql-instances', '${_CLOUDSQL_INSTANCE}',
    ]
    timeout: 600s

# Substitutions for environment-specific values
substitutions:
  _REGION: 'us-central1'
  _CLOUDSQL_INSTANCE: ''  # Set this in trigger or manually

# Build options for optimization
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '50'
  logging: 'CLOUD_LOGGING_ONLY'

# Build timeout
timeout: '2400s'

# Build images to store
images:
  - 'gcr.io/$PROJECT_ID/devsecurex-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/devsecurex-backend:latest'